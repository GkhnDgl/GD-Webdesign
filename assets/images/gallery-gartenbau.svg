<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Moderne Gartengestaltung mit Natursteinpfad und Bepflanzung">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="foliage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="680" cy="120" r="50" fill="#fef08a" opacity="0.8"/>

  <!-- Background hills/trees -->
  <path d="M0 380 Q 200 320, 400 360 T 800 340 L 800 600 L 0 600 Z" fill="#065f46" opacity="0.4"/>
  <path d="M0 400 Q 250 350, 500 390 T 800 370 L 800 600 L 0 600 Z" fill="#047857" opacity="0.7"/>

  <!-- Main Lawn Ground -->
  <path d="M0 430 Q 400 410, 800 440 L 800 600 L 0 600 Z" fill="url(#lawn)"/>

  <!-- Winding Stone Pathway -->
  <path d="M 350 600 C 370 520, 420 480, 450 430 L 510 432 C 470 485, 430 525, 420 600 Z" fill="url(#stone)"/>
  <ellipse cx="385" cy="570" rx="25" ry="10" fill="#cbd5e1"/>
  <ellipse cx="400" cy="530" rx="20" ry="8" fill="#cbd5e1"/>
  <ellipse cx="430" cy="490" rx="18" ry="7" fill="#cbd5e1"/>
  <ellipse cx="460" cy="455" rx="15" ry="6" fill="#cbd5e1"/>

  <!-- Ornamental Plants & Shrubs -->
  <circle cx="150" cy="420" r="65" fill="url(#foliage)"/>
  <circle cx="220" cy="440" r="50" fill="#059669"/>
  <circle cx="100" cy="450" r="45" fill="#10b981"/>

  <!-- Flowers -->
  <circle cx="130" cy="400" r="8" fill="#f43f5e"/>
  <circle cx="160" cy="385" r="9" fill="#fbbf24"/>
  <circle cx="180" cy="410" r="7" fill="#a855f7"/>

  <circle cx="650" cy="440" r="70" fill="url(#foliage)"/>
  <circle cx="730" cy="460" r="55" fill="#047857"/>
  <circle cx="590" cy="465" r="40" fill="#34d399"/>

  <circle cx="640" cy="410" r="10" fill="#fbbf24"/>
  <circle cx="670" cy="425" r="8" fill="#f43f5e"/>

  <!-- Modern Raised Planter Box -->
  <rect x="50" y="480" width="220" height="70" rx="8" fill="#475569"/>
  <rect x="55" y="475" width="210" height="12" rx="4" fill="#64748b"/>
  <path d="M 60 475 Q 110 420, 160 475 Q 210 420, 260 475 Z" fill="#10b981"/>
</svg>
