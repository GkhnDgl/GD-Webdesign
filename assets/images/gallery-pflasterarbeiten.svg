<!--
  Project Gallery Image: Pflaster- & Steinarbeiten (Paving & Stone Masonry)
  License: CC0 / Public Domain (Original vector illustration created for GD Webdesign Master Template A)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Gepflasterter Auffahrtsbereich mit präzisem Steinmuster und Natursteinmauer">
  <defs>
    <linearGradient id="pavingSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="pavingStone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#pavingSky)"/>

  <!-- Background Wall / House Entrance -->
  <rect x="0" y="0" width="800" height="280" fill="#f8fafc"/>
  <rect x="150" y="80" width="180" height="200" fill="#1e293b"/>
  <rect x="170" y="100" width="140" height="180" fill="#047857"/>

  <!-- Garage Door -->
  <rect x="420" y="100" width="300" height="180" fill="#334155"/>
  <line x1="420" y1="145" x2="720" y2="145" stroke="#475569" stroke-width="3"/>
  <line x1="420" y1="190" x2="720" y2="190" stroke="#475569" stroke-width="3"/>
  <line x1="420" y1="235" x2="720" y2="235" stroke="#475569" stroke-width="3"/>

  <!-- Paved Driveway Ground -->
  <rect x="0" y="280" width="800" height="320" fill="url(#pavingStone)"/>

  <!-- Interlocking Paving Pattern Lines -->
  <pattern id="interlock" width="60" height="30" patternUnits="userSpaceOnUse">
    <path d="M 0 0 L 60 0 M 0 15 L 60 15 M 0 30 L 60 30 M 30 0 L 30 15 M 0 15 L 0 30 M 60 15 L 60 30" stroke="#1e293b" stroke-width="2" fill="none" opacity="0.6"/>
  </pattern>
  <rect x="0" y="280" width="800" height="320" fill="url(#interlock)"/>

  <!-- Curbs / Border Stones -->
  <rect x="0" y="275" width="800" height="12" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>
</svg>
